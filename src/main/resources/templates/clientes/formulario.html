<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de cliente</title>
</head>
<body>

    <h1>Registrar o editar cliente</h1>

    <form th:action="@{/clientes/guardar}"
          th:object="${cliente}"
          method="post">

        <input type="hidden" th:field="*{idCliente}">

        <label>Identificación:</label>
        <input type="text" th:field="*{identificacion}" required>
        <br><br>

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>
        <br><br>

        <label>Teléfono:</label>
        <input type="text" th:field="*{telefono}" required>
        <br><br>

        <label>Correo:</label>
        <input type="email" th:field="*{correo}" required>
        <br><br>

        <label>Dirección:</label>
        <input type="text" th:field="*{direccion}" required>
        <br><br>

        <button type="submit">Guardar cliente</button>

        <a th:href="@{/clientes}">Cancelar</a>

    </form>

</body>
</html>
