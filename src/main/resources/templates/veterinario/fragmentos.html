<!-- Fragmento #1 formulario unificado para agregar y modificar un veterinario -->
<section th:fragment="formulario">
    <div class="row py-4 mb-2 bg-light">
        <div class="col-md-1">
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-primary"
                    data-bs-toggle="modal" data-bs-target="#veterinarioModal"
                    data-modo="agregar" th:data-titulo="#{veterinario.agregar}">
                <i class="fa-solid fa-plus"></i> [[#{veterinario.agregar}]]
            </button>
        </div>
    </div>
    <div class="modal fade modal-formulario" id="veterinarioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" th:action="@{/veterinario/guardar}">
                    <div class="modal-header">
                        <h5 class="modal-title"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="veterinario-id" name="idVeterinario"/>
                        <div class="mb-3">
                            <label for="veterinario-identificacion">[[#{veterinario.identificacion}]]</label>
                            <input type="text" id="veterinario-identificacion" name="identificacion" class="form-control" maxlength="20" required/>
                        </div>
                        <div class="mb-3">
                            <label for="veterinario-nombre">[[#{veterinario.nombre}]]</label>
                            <input type="text" id="veterinario-nombre" name="nombre" class="form-control" maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="veterinario-especialidad">[[#{veterinario.especialidad}]]</label>
                            <input type="text" id="veterinario-especialidad" name="especialidad" class="form-control" maxlength="100"/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento #2 listado de veterinarios -->
<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-9">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{veterinario.listado}]]</h4></div>
                <div class="card-body">
                    <div th:if="${veterinarios != null and !veterinarios.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>[[#{veterinario.identificacion}]]</th>
                                    <th>[[#{veterinario.nombre}]]</th>
                                    <th>[[#{veterinario.especialidad}]]</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="v : ${veterinarios}">
                                    <td>[[${v.idVeterinario}]]</td>
                                    <td>[[${v.identificacion}]]</td>
                                    <td>[[${v.nombre}]]</td>
                                    <td>[[${v.especialidad}]]</td>
                                    <td class="text-nowrap">
                                        <button type="button" class="btn btn-danger btn-sm"
                                                data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                th:data-bs-id="${v.idVeterinario}"
                                                th:data-bs-descripcion="${v.nombre}">
                                            <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]
                                        </button>
                                        <button type="button" class="btn btn-warning btn-sm"
                                                data-bs-toggle="modal" data-bs-target="#veterinarioModal"
                                                data-modo="editar"
                                                th:data-titulo="#{accion.actualizar}"
                                                th:data-campo-veterinario-id="${v.idVeterinario}"
                                                th:data-campo-veterinario-identificacion="${v.identificacion}"
                                                th:data-campo-veterinario-nombre="${v.nombre}"
                                                th:data-campo-veterinario-especialidad="${v.especialidad}">
                                            <i class="fas fa-pencil-alt"></i> [[#{accion.actualizar}]]
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${veterinarios == null or veterinarios.empty}">
                        <span>[[#{lista.vacia}]]</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center bg-success text-white mb-3">
                <div class="card-body"><h3>[[#{veterinario.total}]]</h3>
                    <h4 class="fs-2"><i class="fa-solid fa-user-doctor"></i> [[${totalVeterinarios}]]</h4>
                </div>
            </div>
        </div>
    </div>
</section>
