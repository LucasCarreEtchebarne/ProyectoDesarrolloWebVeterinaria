<!-- Fragmento #1 que irá en el head de todas las páginas -->
<head th:fragment="head">
    <title th:text="#{aplicacion.titulo}">MetroPet Clinic</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/fav/favicon-16x16.png}"/>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/fav/favicon-32x32.png}"/>
    <link rel="shortcut icon" th:href="@{/fav/favicon.ico}"/>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/fav/apple-touch-icon.png}"/>
    <link rel="manifest" th:href="@{/fav/site.webmanifest}"/>
    <meta name="theme-color" content="#ffffff"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/rutinas.js}"></script>
</head>

<!-- Fragmento #2 define el encabezado de las páginas -->
<header th:fragment="header">
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a th:href="@{/}" class="navbar-brand">
                <i class="fa-solid fa-paw"></i> [[#{aplicacion.titulo}]]
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/}"><i class="fa-solid fa-house"></i> [[#{plantilla.inicio}]]</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/cita/listado}"><i class="fa-solid fa-calendar-check"></i> Citas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- Fragmento #3 define el pie de página -->
<footer th:fragment="footer" class="p-3 bg-primary text-white text-center mt-auto">    
    <p class="mb-0">[[#{plantilla.derechos}]] &copy;</p>
</footer>

<!-- Fragmento #4 define una ventana tipo Toast para mostrar mensajes al usuario -->
<section th:fragment="mostrarToast">
    <div aria-live="polite" aria-atomic="true"
         class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">
        <div th:if="${error}" class="toast show" role="alert">
            <div class="toast-header text-white bg-danger">
                <i class="fa-solid fa-triangle-exclamation"></i> <strong class="me-auto"> [[#{error}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${error}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
        <div th:if="${todoOk}" class="toast show" role="status">
            <div class="toast-header text-white bg-success">
                <i class="fa-solid fa-square-check"></i> <strong class="me-auto"> [[#{atencion}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${todoOk}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Fragmento #5 define una ventana modal para confirmar la eliminación -->
<section th:fragment="confirmarEliminar(accionEliminar, nombreId)">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="${accionEliminar}" method="post">
                    <input type="hidden" th:attr="name=${nombreId}" id="modalId"/>
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title"><i class="fa-solid fa-trash"></i> [[#{accion.confirmar}]]</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>[[#{accion.confirmar.texto1}]]<strong id="modalDescripcion"></strong>?</p>
                        <h6>[[#{accion.confirmar.texto2}]]</h6>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
