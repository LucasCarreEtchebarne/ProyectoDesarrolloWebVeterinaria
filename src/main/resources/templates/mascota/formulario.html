<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de mascota</title>
</head>
<body>

    <h1>Registrar o editar mascota</h1>

    <form th:action="@{/mascotas/guardar}"
          th:object="${mascota}"
          method="post">

        <input type="hidden" th:field="*{idMascota}">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required>
        <br><br>

        <label>Especie:</label>
        <input type="text" th:field="*{especie}" required>
        <br><br>

        <label>Raza:</label>
        <input type="text" th:field="*{raza}" required>
        <br><br>

        <label>Fecha de nacimiento:</label>
        <input type="date" th:field="*{fechaNacimiento}" required>
        <br><br>

        <label>Propietario:</label>
        <select name="idCliente" required>
            <option value="">Seleccione un propietario</option>
            <option th:each="cliente : ${clientes}"
                    th:value="${cliente.idCliente}"
                    th:text="${cliente.nombre}"
                    th:selected="${mascota.cliente != null and mascota.cliente.idCliente == cliente.idCliente}">
            </option>
        </select>

        <br><br>

        <button type="submit">Guardar mascota</button>

        <a th:href="@{/mascotas}">Cancelar</a>

    </form>

</body>
</html>
